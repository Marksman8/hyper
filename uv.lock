[[package]]
name = "aura"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "fastapi" },
    { name = "httpx" },
    { name = "psutil" },
    { name = "pydantic" },
    { name = "pydantic-settings" },
    { name = "pyyaml" },
    { name = "rich" },
    { name = "structlog" },
    { name = "typer" },
    { name = "uvicorn", extra = ["standard"] },
]

[package.optional-dependencies]
voice = [
    { name = "faster-whisper" },
    { name = "numpy" },
    { name = "openwakeword" },
    { name = "piper-tts" },
    { name = "sounddevice" },
]

[package.dev-dependencies]
dev = [
    { name = "mypy" },
    { name = "pytest" },
    { name = "pytest-asyncio" },
    { name = "respx" },
    { name = "ruff" },
    { name = "types-pyyaml" },
]

[package.metadata]
requires-dist = [
    { name = "fastapi", specifier = ">=0.115" },
    { name = "faster-whisper", marker = "extra == 'voice'", specifier = ">=1.1" },
    { name = "httpx", specifier = ">=0.27" },
    { name = "numpy", marker = "extra == 'voice'", specifier = ">=2.1" },
    { name = "openwakeword", marker = "extra == 'voice'", specifier = ">=0.6" },
    { name = "piper-tts", marker = "extra == 'voice'", specifier = ">=1.2" },
    { name = "psutil", specifier = ">=6.1" },
    { name = "pydantic", specifier = ">=2.9" },
    { name = "pydantic-settings", specifier = ">=2.6" },
    { name = "pyyaml", specifier = ">=6.0" },
    { name = "rich", specifier = ">=13.9" },
    { name = "sounddevice", marker = "extra == 'voice'", specifier = ">=0.5" },
    { name = "structlog", specifier = ">=24.4" },
    { name = "typer", specifier = ">=0.15" },
    { name = "uvicorn", extras = ["standard"], specifier = ">=0.32" },
]
provides-extras = ["voice"]

