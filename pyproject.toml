[project]
name = "aura"
version = "0.1.0"
description = "AURA - Autonomous Unified Reasoning Assistant. Local-first, model-agnostic personal AI runtime."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

# v0.1 dependency policy: NO torch, NO transformers.
# All inference (chat + embeddings) is served by an external OpenAI-compatible
# process (llama.cpp `llama-server`). AURA core stays a thin, fast-starting,
# CPU-only application. Heavy ML deps enter only when a phase actually needs
# them (Phase 2: STT/TTS, Phase 5: vision, Phase 8: LoRA).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.9",
    "psutil>=6.1",
]

[project.optional-dependencies]
# Phase 2. An extra, not a core dependency: AURA Core must stay a fast-starting
# 69 MB process, and the voice client is a separate process that happens to
# live in the same repo. `uv sync --extra voice`.
#
# Note what is NOT here: torch. openWakeWord, faster-whisper (CTranslate2) and
# Piper all run on onnxruntime, so the whole speech stack costs ~250 MB of
# runtime instead of ~2.5 GB. Torch does not enter until Phase 8 (LoRA).
voice = [
    "sounddevice>=0.5",       # PortAudio bindings; mic capture + playback
    "numpy>=2.1",             # audio buffers
    "openwakeword>=0.6",      # wake word, ONNX
    "faster-whisper>=1.1",    # STT via CTranslate2
    "piper-tts>=1.2",         # TTS, ONNX
]

# v0.1.1. tkinter is stdlib, so the window itself costs nothing; these are only
# for the system tray icon. `uv sync --extra desktop`.
desktop = [
    "pystray>=0.19",
    "pillow>=11.0",
]

# Phase 10A. The presence overlay: avatar, subtitle, speech bubble.
#
# A SEPARATE PROCESS from AURA Core, and a separate extra, because it is the
# heaviest UI dependency in the project and Core must stay a 69 MB process that
# starts fast. `uv sync --extra presence`.
#
# tkinter (ADR-0002) stays for the status/approval shell. It cannot do the
# avatar: it has only chroma-key `-transparentcolor`, which fringes on
# anti-aliased art, and no compositing. See ADR-0003 for the measurement that
# justifies the cost.
presence = [
    "PySide6-Essentials>=6.8",  # Qt Widgets/Gui/Core only, not the full Qt
]

# Phase 5. Still no torch: mss is a thin screen-capture shim and RapidOCR runs
# on onnxruntime, which the voice extra already pulls in.
vision = [
    "mss>=10.0",                  # screen capture, multi-monitor
    "rapidocr-onnxruntime>=1.4",  # OCR on ONNX
    "pywin32>=310; sys_platform == 'win32'",  # window and process detection
    "numpy>=2.1",
]

[project.scripts]
aura = "aura.__main__:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
]

[tool.uv]
# openWakeWord 0.6 requires tflite-runtime on Linux, but tflite-runtime ships
# no wheels past cp311 — so a universal resolution for Python 3.12 fails even
# on Windows, where the dependency is irrelevant. Narrow the marker to the
# environments where a wheel actually exists. AURA drives openWakeWord with
# inference_framework="onnx" on every platform, so tflite is never loaded.
override-dependencies = [
    "tflite-runtime>=2.8.0; sys_platform == 'linux' and python_version < '3.12'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RUF", "ASYNC", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
# Depends() in argument defaults is the FastAPI idiom, not a mutable default.
"src/aura/api/*.py" = ["B008"]
# Optional hooks on a provider ABC: a backend that does not animate should
# not have to implement four no-ops to satisfy the linter. Same pattern as
# OCRProvider.load/unload.
"src/aura/presence/avatar/base.py" = ["B027"]
# typer.Option()/Argument() in defaults is likewise how typer declares a CLI.
"src/aura/__main__.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true
mypy_path = "src"
packages = ["aura"]

[[tool.mypy.overrides]]
module = [
    "psutil.*",
    # Neither ships type information.
    "pystray.*",
    "PIL.*",
    # Speech backends ship no py.typed marker. Confined to the provider
    # packages, which are the only modules allowed to import them anyway.
    "sounddevice.*",
    "openwakeword.*",
    "faster_whisper.*",
    "piper.*",
    "onnxruntime.*",
    # Phase 5. Same rule: confined to aura/vision/, which is the only
    # package permitted to import them (tests/unit/test_seam.py).
    "mss.*",
    "rapidocr_onnxruntime.*",
    "win32gui.*",
    "win32process.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a running model server",
]
