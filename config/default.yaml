# AURA default configuration.
#
# Precedence (lowest to highest):
#   1. this file
#   2. config/local.yaml        (gitignored, your machine-specific overrides)
#   3. .env / environment       (AURA__SECTION__FIELD, e.g. AURA__API__PORT)
#
# Secrets belong in .env or var/secrets/, never here.

app:
  name: aura
  version: "0.1.0"
  # Emergency stop (spec section 13/23). When true, AURA accepts requests but
  # refuses every outbound model call and (later) every tool execution.
  # Flipped at runtime via POST /v1/control/estop.
  emergency_stop: false

api:
  # Loopback only. Binding to 0.0.0.0 exposes an unauthenticated-by-default
  # surface to the local network; the config validator rejects it.
  host: "127.0.0.1"
  port: 8760
  cors_origins: []
  request_timeout_s: 300

llm:
  # The replaceability seam. Any OpenAI-compatible server satisfies this.
  provider: "openai_compat"
  base_url: "http://127.0.0.1:8081/v1"
  api_key: ""
  # "default" means "whatever the server has loaded" - llama-server ignores the
  # model field. Set explicitly when pointing at Ollama or vLLM.
  model: "default"
  # Generation defaults. Overridable per request.
  temperature: 0.7
  top_p: 0.95
  max_tokens: 1024
  # Wall-clock ceiling for one generation.
  timeout_s: 180
  # Connection attempts before declaring the model server unavailable.
  connect_retries: 2

memory:
  db_path: "var/data/aura.db"
  # Turns of history replayed into the prompt. Kept small because a 4B model at
  # 8k context degrades well before it runs out of tokens.
  history_turns: 12
  # Hard ceiling on characters of history assembled into a prompt, as a cheap
  # stand-in for token counting until a tokenizer is wired in (Phase 2).
  history_char_budget: 12000

security:
  api_token: ""              # generated into var/secrets/api_token if blank
  token_file: "var/secrets/api_token"
  audit_enabled: true
  # Deny model calls entirely if the audit log cannot be written. Fail closed.
  require_audit: true

runtime:
  # Supervisor for the model server subprocess. Disabled by default in v0.1:
  # you start llama-server yourself via scripts/start_model_server.ps1 so that
  # failures are visible rather than swallowed by a supervisor.
  manage_model_server: false
  resource_poll_s: 10

logging:
  level: "INFO"
  format: "console"          # console | json
  file: "var/logs/aura.log"
  # Redact these config keys anywhere they would be serialized.
  redact_keys: ["api_token", "api_key", "password", "secret", "token"]

persona:
  # v0.1 system prompt. Deliberately minimal - personality is a Phase 7 concern
  # driven by the user model, not a hand-written paragraph that grows forever.
  name: "AURA"
  system_prompt: |
    You are AURA, a local-first personal AI assistant running entirely on the
    user's own machine. You are direct, concise, and technically precise.

    Guidelines:
    - Answer the question that was asked. Do not pad.
    - If you do not know something, say so plainly.
    - You have no ability to execute code, browse the web, see the screen, or
      modify files. Do not claim otherwise or pretend to perform actions.
    - Prefer concrete specifics over hedged generalities.

tools:
  # Phase 3. Tools exist and are permission-gated, but the model does not
  # choose them yet - that is Phase 4.
  enabled: true
  # Directories AURA may read or write. Deliberately empty by default: an
  # unconfigured assistant should be able to touch nothing, not everything.
  # Add your project directories here.
  workspace_roots:
    - "C:/Users/ajsal/Downloads/Aura-Hyper"
  # Extra refusals inside those roots. Empty uses the built-in list, which
  # already covers .env, var/secrets, *.pem, id_rsa and .ssh.
  deny_patterns: []
  # 1 = read-only without asking. Writing a file or running Python is level 2
  # and needs an explicit human confirmation on every call.
  max_autonomous_level: 1
  max_confirmable_level: 3
  python_enabled: true
  default_timeout_s: 30.0

agent:
  # Phase 4. When tools are enabled and a turn asks for them, the model drives
  # a loop: call a tool, read the result, decide what to do next.
  enabled: true
  # A hard ceiling on iterations. The model is told when it runs out, so its
  # final answer can say what is unfinished instead of inventing a conclusion.
  max_steps: 8
  max_seconds: 180.0
  # Choosing a tool is a decision, not a creative act.
  tool_temperature: 0.2

vision:
  # Phase 5. OFF by default, and that is not timidity: reading a file is
  # bounded by the workspace allow-list, but reading the screen is bounded by
  # whatever happens to be in front of you - which may be a password manager,
  # a bank, or someone else's messages.
  #   private  no capture at all (default)
  #   assist   capture only when you ask
  #   active   capture when you ask and, once the loop exists, on events
  #   sleep    everything paused
  # Turn it on with `aura vision on`; the model cannot turn it on itself.
  mode: "private"
  # Never captured, matched against the foreground window title and the
  # process name. `aura vision deny Chrome` adds to this at runtime.
  deny_apps: []
  # When non-empty, the ONLY applications captured.
  allow_apps: []
  denied_monitors: []
  # Added to the built-in credential patterns in vision/privacy.py, never
  # substituted for them: editing this file cannot switch off the rule that
  # protects your password manager.
  extra_deny_titles: []
  ocr_backend: "rapidocr"
  # Below this, a recognised line is reported as unclear rather than as text.
  # OCR's failure mode is confident nonsense.
  ocr_min_confidence: 0.5
  # A full IDE screenshot OCRs to hundreds of fragments, most of them chrome.
  max_lines: 200
  # Detection resolution cap, long side. RapidOCR ships tuned for photos of
  # documents: its default does not downscale a 1920x1080 screenshot at all,
  # which measured 42 seconds per read here - past the tool's own timeout.
  # Lower is faster and blurrier.
  ocr_det_side: 1600
  # Bounded, and not only out of politeness to the resident LLM: the -1
  # default oversubscribes 24 logical cores and measured 5x SLOWER on
  # detection. 8 was the best end-to-end setting on this machine.
  ocr_threads: 8
  change_threshold: 0.02

personalization:
  # Phase 7. Acting on what Phase 6 learned: preferences become instructions
  # in the system prompt, and -- when stated outright -- a token budget.
  #
  # Adaptation changes behaviour every turn without being asked. If it cannot
  # be switched off it cannot be blamed, and anything that cannot be blamed
  # cannot be fixed. `aura profile` shows what is being applied and why.
  enabled: true
  # Prompt directives follow any believed preference. Sampling changes follow
  # only ones you stated outright: a wrong directive gives a differently-toned
  # answer, but a wrong token limit truncates mid-sentence and you would have
  # no way to connect that to something you said weeks ago.
  adapt_parameters: true
